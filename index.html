<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10080d" />
  <meta name="description" content="A little moment, made just for you." />
  <title>For You, With Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="scene" id="scene" aria-label="A romantic message">
    <div class="ambient ambient--one"></div>
    <div class="ambient ambient--two"></div>
    <div class="grain"></div>
    <canvas id="particles" aria-hidden="true"></canvas>

    <div class="intro" id="intro">
      <p class="eyebrow" id="eyebrow">A LITTLE SOMETHING, JUST FOR YOU</p>
      <p class="opening-line" id="openingLine">Some feelings deserve<br><em>their own little universe.</em></p>
    </div>

    <section class="reveal" id="reveal" aria-live="polite">
      <div class="heart-stage" id="heartStage" aria-hidden="true">
        <div class="heart-halo"></div>
        <svg class="heart-svg" id="heartSvg" viewBox="0 0 220 200" role="img" aria-label="A glowing heart">
          <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff1d4"/>
              <stop offset="42%" stop-color="#e7b66f"/>
              <stop offset="100%" stop-color="#bd617b"/>
            </linearGradient>
            <filter id="heartGlow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="3.4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path id="heartPath" d="M110 177 C95 163 25 119 25 69 C25 29 74 15 110 57 C146 15 195 29 195 69 C195 119 125 163 110 177 Z"
                fill="none" stroke="url(#heartGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                filter="url(#heartGlow)" pathLength="1000"/>
          <path class="heart-inner" d="M110 177 C95 163 25 119 25 69 C25 29 74 15 110 57 C146 15 195 29 195 69 C195 119 125 163 110 177 Z"
                fill="url(#heartGradient)" opacity="0"/>
        </svg>
        <div class="heart-core"></div>
      </div>

      <div class="love-message" id="loveMessage">
        <p class="message-kicker">IF THE WHOLE WORLD WENT QUIET…</p>
        <h1 aria-label="I love you"><span class="word">I</span><span class="word">LOVE</span><span class="word">YOU</span></h1>
        <div class="title-rule"><span></span><i>✦</i><span></span></div>
        <p class="her-name" id="herName">My favourite person</p>
        <p class="personal-note" id="personalNote">I'd still find a thousand little ways to choose you.</p>
        <div class="end-heart" aria-hidden="true">♥</div>
      </div>
    </section>

    <p class="signature" id="signature">MADE WITH ALL MY HEART</p>
    <button class="replay" id="replay" type="button" aria-label="Replay the animation">
      <span aria-hidden="true">↻</span> Replay the moment
    </button>
    <noscript><p class="noscript">This little moment needs JavaScript to come to life.</p></noscript>
  </main>

  <!-- GSAP is loaded from its official CDN. The experience has a graceful fallback if it is unavailable. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
